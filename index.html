<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tentang Kopi</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="libs/aframe.min.js"></script>
    <script src="libs/mindar-image-aframe.prod.js"></script>
    <script src="libs/html2canvas.min.js"></script>
    <script>
        // SHADER REVERTED TO V19 (Simpler version, NO ClampToEdge)
        AFRAME.registerShader('chromakey', {
            schema: { src: {type: 'map'}, color: {type: 'color', default: '#00ff00'}, threshold: {type: 'number', default: 0.4}, softness: {type: 'number', default: 0.1} },
            init: function (data) {
                var videoTexture = new THREE.VideoTexture(data.src);
                videoTexture.minFilter = THREE.LinearFilter;
                this.material = new THREE.ShaderMaterial({
                    uniforms: { texture: {value: videoTexture}, color: {value: new THREE.Color(data.color)}, threshold: {value: data.threshold}, softness: {value: data.softness} },
                    vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
                    fragmentShader: 'uniform sampler2D texture; uniform vec3 color; uniform float threshold; uniform float softness; varying vec2 vUv; void main() { vec4 texColor = texture2D(texture, vUv); float Y = 0.299 * texColor.r + 0.587 * texColor.g + 0.114 * texColor.b; float Cb = 0.564 * (texColor.b - Y); float Cr = 0.713 * (texColor.r - Y); float Ykey = 0.299 * color.r + 0.587 * color.g + 0.114 * color.b; float Cbkey = 0.564 * (color.b - Ykey); float Crkey = 0.713 * (color.r - Ykey); float dist = distance(vec2(Cb, Cr), vec2(Cbkey, Crkey)); float alpha = smoothstep(threshold - softness, threshold + softness, dist); float spill = 1.0 - smoothstep(threshold, threshold + softness * 2.0, dist); texColor.g = texColor.g - spill * (texColor.g - max(texColor.r, texColor.b)) * 0.5; gl_FragColor = vec4(texColor.rgb, alpha); }',
                    transparent: true, side: THREE.DoubleSide
                });
            },
            update: function (data) { if (data.src) this.material.uniforms.texture.value = new THREE.VideoTexture(data.src); this.material.uniforms.color.value = new THREE.Color(data.color); }
        });

        AFRAME.registerComponent('chromakey-material', {
            schema: { src: {type: 'selector'}, color: {type: 'color', default: '#00ff00'} },
            init: function() { this.el.setAttribute('material', { shader: 'chromakey', src: this.data.src, color: this.data.color, transparent: true, side: 'double' }); }
        });
    </script>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        /* FORCE HIDE VR BUTTON */
        .a-enter-vr { display: none !important; }
        
        /* UI LAYOUT STRUCTURE FOR CAPTURE */
        #ui-container {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 15;
            pointer-events: none; /* Let clicks pass through to 3D scene */
            /* REMOVED FLEX PROPERTIES TO FIX STACKING */
        }

        /* UI INFO PANEL */
        .info-panel { 
            position: absolute; /* CHANGED BACK TO ABSOLUTE */
            bottom: 0; 
            left: 0;
            width: 100%; 
            padding: 20px 20px 40px 20px; 
            box-sizing: border-box; 
            transform: translateY(120%); 
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            border-radius: 25px 25px 0 0; 
            pointer-events: auto; /* Enable clicks on panel */
        }
        .info-panel.visible { transform: translateY(0); }
        .action-btn { display: inline-flex; width: 45px; height: 45px; align-items: center; justify-content: center; border-radius: 50%; margin-right: 10px; font-size: 1.2rem; text-decoration: none; box-shadow: 0 4px 10px rgba(0,0,0,0.2); transition: transform 0.2s; }
        .action-btn:active { transform: scale(0.9); }

        /* CAMERA CONTROLS */
        .media-controls {
            position: fixed; bottom: 30px; left: 0; right: 0;
            display: flex; justify-content: center; align-items: center; gap: 30px;
            z-index: 20; transition: bottom 0.4s ease;
            pointer-events: none;
        }
        .media-controls.shifted { bottom: 200px; } /* Shifts up when panel appears */
        
        .cam-btn {
            width: 60px; height: 60px; border-radius: 50%; border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(5px);
            border: 2px solid rgba(255,255,255,0.5); color: #fff; font-size: 1.5rem;
            pointer-events: auto; transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .cam-btn:active { transform: scale(0.9); }
        .cam-btn.record { border-color: #ff4444; color: #ff4444; }
        .cam-btn.recording { 
            background: #ff4444; color: #fff; animation: pulse 1.5s infinite; 
            border: 4px solid rgba(255, 255, 255, 0.5);
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        /* PREVIEW MODAL */
        .preview-modal {
            position: fixed; inset: 0; background: #000; z-index: 1000;
            display: none; flex-direction: column;
        }
        .preview-content { flex: 1; display: flex; align-items: center; justify-content: center; background: #111; overflow: hidden; }
        .preview-content img, .preview-content video { max-width: 100%; max-height: 100%; object-fit: contain; }
        .preview-actions {
            height: 80px; background: #000; display: flex; align-items: center; justify-content: space-around;
            border-top: 1px solid #333;
        }
        .p-btn {
            background: none; border: none; color: #fff; font-size: 1rem;
            display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; opacity: 0.8;
        }
        .p-btn:hover { opacity: 1; }
        .p-btn i { font-size: 1.5rem; margin-bottom: 2px; }

        /* FLASH EFFECT */
        #flash { position: fixed; inset: 0; background: #fff; z-index: 500; opacity: 0; pointer-events: none; }
        .flash-anim { animation: flash 0.3s; }
        @keyframes flash { 0% { opacity: 0.8; } 100% { opacity: 0; } }
    </style>
</head>
<body>
    <!-- UPDATED SCENE: REVERTED TO V19 PARAMS (Higher Beta = Less Jitter) -->
    <!-- UPDATED: missTolerance set to 1 as requested -->
    <a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading:no; uiScanning:no; filterMinCF:0.001; filterBeta: 1000; warmupTolerance: 5; missTolerance: 1;" 
             color-space="sRGB" 
             renderer="colorManagement: true, physicallyCorrectLights; preserveDrawingBuffer: true" 
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false">
        <a-assets></a-assets>
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        <div id="ar-targets"></div>
    </a-scene>

    <div id="ui-container"></div>

    
    <!-- CAMERA CONTROLS (CONDITIONAL) -->
    <div class="media-controls" id="media-controls">
        <button class="cam-btn" id="btn-snap" onclick="takePhoto()"><i class="fas fa-camera"></i></button>
        <button class="cam-btn record" id="btn-record" onclick="toggleRecord()"><i class="fas fa-video"></i></button>
    </div>

    <!-- PREVIEW MODAL -->
    <div class="preview-modal" id="preview-modal">
        <div class="preview-content" id="preview-content"></div>
        <div class="preview-actions">
            <button class="p-btn" onclick="closePreview()" style="color:#ff4444"><i class="fas fa-times"></i> Batal</button>
            <button class="p-btn" onclick="shareMedia()" style="color:#00f0ff"><i class="fas fa-share-alt"></i> Share</button>
            <a id="download-link" style="display:none"></a>
        </div>
    </div>
    
    <div id="flash"></div>

    <script>
        // GLOBAL STATE FOR RECORDER
        window.allData = [];
        window.activeUIIndex = -1;
        let cachedUIOverlay = null; // Cache for html2canvas result

        // --- MEDIA CAPTURE LOGIC WITH BACKGROUND FIX ---
        let mediaRecorder;
        let recordedChunks = [];
        let isRecording = false;
        let currentBlob = null;
        let currentType = 'image';
        
        // COMPOSITING VARIABLES
        let compositeCanvas = null;
        let compositeCtx = null;
        let compositeAnimId = null;

        function setupCompositeCanvas() {
            const scene = document.querySelector('a-scene');
            const webglCanvas = scene.canvas;
            
            // FIX: Robustly find the webcam video.
            // MindAR's webcam video has a srcObject (stream), while asset videos have a src attribute (file URL).
            const allVideos = document.querySelectorAll('video');
            let video = null;
            
            for (let i = 0; i < allVideos.length; i++) {
                const v = allVideos[i];
                // Check if it is the webcam feed (has stream, no file src, readyState > 0)
                if (v.srcObject && v.readyState >= 2) {
                    video = v;
                    break;
                }
            }
            
            // If strictly scanning logic failed, try finding a video not in a-assets
            if (!video) {
                for (let i = 0; i < allVideos.length; i++) {
                    const v = allVideos[i];
                    // MindAR puts video in body, assets are in a-assets
                    if (!v.closest('a-assets') && v.style.display !== 'none') {
                        video = v;
                        break;
                    }
                }
            }

            if (!video || !webglCanvas) return null;

            if (!compositeCanvas) {
                compositeCanvas = document.createElement('canvas');
                compositeCtx = compositeCanvas.getContext('2d');
            }

            // Sync size with WebGL canvas (screen size)
            if (compositeCanvas.width !== webglCanvas.width || compositeCanvas.height !== webglCanvas.height) {
                compositeCanvas.width = webglCanvas.width;
                compositeCanvas.height = webglCanvas.height;
            }

            return { webglCanvas, video };
        }

        // Helper to prevent video stretching (Cover Mode)
        function drawVideoCover(ctx, video, w, h) {
             const vw = video.videoWidth;
             const vh = video.videoHeight;
             if (!vw || !vh) { ctx.drawImage(video, 0, 0, w, h); return; }
             
             const canvasRatio = w / h;
             const videoRatio = vw / vh;
             let dw, dh, sx, sy;
             
             if (canvasRatio > videoRatio) {
                 dw = w; dh = w / videoRatio;
                 sx = 0; sy = (h - dh) / 2;
             } else {
                 dh = h; dw = h * videoRatio;
                 sx = (w - dw) / 2; sy = 0;
             }
             ctx.drawImage(video, sx, sy, dw, dh);
        }

        // ASYNC UI CACHER (Called when UI appears)
        async function updateUICache() {
            const uiContainer = document.getElementById('ui-container');
            if(uiContainer) {
                try {
                    // html2canvas takes a screenshot of the DOM element
                    cachedUIOverlay = await html2canvas(uiContainer, {
                        backgroundColor: null,
                        scale: 1, // Match screen pixel density usually
                        logging: false
                    });
                } catch(e) {
                    console.error("UI Cache failed", e);
                    cachedUIOverlay = null;
                }
            }
        }

        function drawCompositeFrame() {
            const sources = setupCompositeCanvas();
            if (!sources) return;
            const { webglCanvas, video } = sources;
            const w = compositeCanvas.width;
            const h = compositeCanvas.height;

            // 1. Draw Camera Feed (Background)
            drawVideoCover(compositeCtx, video, w, h);

            // 2. Draw AR Content (Foreground)
            compositeCtx.drawImage(webglCanvas, 0, 0, w, h);

            // 3. Draw Cached UI (Exact Replica)
            if (cachedUIOverlay) {
                compositeCtx.drawImage(cachedUIOverlay, 0, 0, w, h);
            }
            
            // Loop
            compositeAnimId = requestAnimationFrame(drawCompositeFrame);
        }

        async function takePhoto() {
            const flash = document.getElementById('flash');
            if(flash) {
                flash.classList.add('flash-anim');
                setTimeout(() => flash.classList.remove('flash-anim'), 500);
            }

            const sources = setupCompositeCanvas();
            if (sources) {
                const w = compositeCanvas.width;
                const h = compositeCanvas.height;
                
                // Draw Base Layers
                drawVideoCover(compositeCtx, sources.video, w, h);
                compositeCtx.drawImage(sources.webglCanvas, 0, 0, w, h);
                
                // Capture Exact UI at this moment
                const uiContainer = document.getElementById('ui-container');
                try {
                    const uiCanvas = await html2canvas(uiContainer, { backgroundColor: null });
                    compositeCtx.drawImage(uiCanvas, 0, 0, w, h);
                } catch(e) { console.log("Photo UI capture err", e); }
                
                const dataURL = compositeCanvas.toDataURL('image/png');
                showPreview(dataURL, 'image');
            }
        }

        function toggleRecord() {
            const btn = document.getElementById('btn-record');
            if(!btn) return;

            if (!isRecording) {
                // START RECORDING
                isRecording = true;
                btn.classList.add('recording');
                btn.innerHTML = '<i class="fas fa-stop"></i>';
                const snapBtn = document.getElementById('btn-snap');
                if(snapBtn) snapBtn.style.display = 'none'; 

                // Ensure cache is fresh if UI is already visible
                if (window.activeUIIndex !== -1 && !cachedUIOverlay) {
                     updateUICache();
                }

                // Start loop
                drawCompositeFrame();
                
                const stream = compositeCanvas.captureStream(30);
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
                recordedChunks = [];

                mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
                mediaRecorder.onstop = () => {
                    if (compositeAnimId) cancelAnimationFrame(compositeAnimId);
                    
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    showPreview(url, 'video');
                };

                mediaRecorder.start();

            } else {
                // STOP RECORDING
                isRecording = false;
                btn.classList.remove('recording');
                btn.innerHTML = '<i class="fas fa-video"></i>';
                const snapBtn = document.getElementById('btn-snap');
                if(snapBtn) snapBtn.style.display = 'flex';
                mediaRecorder.stop();
            }
        }

        // --- BACK BUTTON HANDLING (SWIPE BACK) ---
        window.addEventListener('popstate', function(event) {
            const modal = document.getElementById('preview-modal');
            if(modal && modal.style.display === 'flex') {
                modal.style.display = 'none';
                const content = document.getElementById('preview-content');
                if(content) content.innerHTML = '';
                currentBlob = null;
            }
        });

        function showPreview(url, type) {
            const modal = document.getElementById('preview-modal');
            const content = document.getElementById('preview-content');
            if(!modal || !content) return;
            
            modal.style.display = 'flex';
            
            // PUSH HISTORY STATE TO TRAP BACK BUTTON
            window.history.pushState({modal: true}, null, "#preview");

            currentType = type;

            if (type === 'image') {
                content.innerHTML = '<img src="' + url + '" />';
                fetch(url).then(res => res.blob()).then(blob => currentBlob = blob);
            } else {
                content.innerHTML = '<video src="' + url + '" controls autoplay loop></video>';
                currentBlob = new Blob(recordedChunks, { type: 'video/webm' });
            }
        }

        function closePreview() {
            // GO BACK IN HISTORY (Triggers popstate to close modal)
            window.history.back();
        }

        async function shareMedia() {
            if (!currentBlob) return;
            
            const fileExt = currentType === 'image' ? 'png' : 'webm';
            const fileName = 'AR_Capture_' + Date.now() + '.' + fileExt;
            const file = new File([currentBlob], fileName, { type: currentType === 'image' ? 'image/png' : 'video/webm' });

            if (navigator.share) {
                try {
                    await navigator.share({
                        files: [file],
                        title: 'AR Experience',
                        text: 'Cek hasil AR saya!'
                    });
                } catch (err) {
                    console.log('Share failed/cancelled', err);
                    downloadMedia(fileName);
                }
            } else {
                downloadMedia(fileName);
            }
        }

        function downloadMedia(fileName) {
            const link = document.getElementById('download-link');
            if(link) {
                link.href = URL.createObjectURL(currentBlob);
                link.download = fileName;
                link.click();
            }
        }

        // --- EXISTING AR LOGIC ---
        fetch('./data.json').then(r => r.json()).then(data => {
            window.allData = data;

            const assets = document.querySelector('a-assets');
            const scene = document.querySelector('a-scene');
            const ui = document.getElementById('ui-container');
            
            data.forEach((item, i) => {
                const id = 'content-' + i;
                const planeId = 'plane-' + i; // NEW ID for targeting opacity
                if(item.isVideo) {
                    const v = document.createElement('video');
                    v.id = id; v.src = item.content; v.setAttribute('loop','true'); v.setAttribute('playsinline','true'); v.setAttribute('webkit-playsinline','true'); v.setAttribute('crossorigin','anonymous');
                    assets.appendChild(v);
                } else {
                    const img = document.createElement('img'); img.id = id; img.src = item.content; assets.appendChild(img);
                }
                
                const el = document.createElement('a-entity');
                el.setAttribute('mindar-image-target', 'targetIndex: ' + item.targetIndex);
                
                // NOTE: 'smooth-fade' logic REMOVED to match v19 stability
                
                const plane = document.createElement('a-plane');
                plane.id = planeId; // Assign ID
                plane.setAttribute('width', '1');
                plane.setAttribute('height', (1/item.targetRatio).toString());
                plane.setAttribute('position', '0 0 0');
                // NOTE: Scale 1.03 REMOVED to match v19 stability
                plane.setAttribute('src', '#' + id);
                
                if(item.isVideo) {
                    // NOTE: 'fix-texture' REMOVED to match v19 stability
                    
                    if(item.isGreenScreen) plane.setAttribute('chromakey-material', 'src:#' + id + '; color:#00ff00');
                    else plane.setAttribute('material', 'shader:flat; src:#'+id+'; side:double'); // Reverted to standard flat shader
                    
                    const vid = document.getElementById(id);
                    el.addEventListener('targetFound', () => { vid.play(); showUI(i, true); });
                    el.addEventListener('targetLost', () => { vid.pause(); showUI(i, false); });
                } else {
                    // For static images, just basic show/hide UI logic
                    el.addEventListener('targetFound', () => showUI(i, true));
                    el.addEventListener('targetLost', () => showUI(i, false));
                }
                
                el.appendChild(plane);
                scene.appendChild(el);

                if(item.ui.show) {
                    const p = document.createElement('div');
                    p.id = 'panel-'+i; p.className = 'info-panel';
                    p.style.background = hexToRgba(item.ui.color, item.ui.opacity);
                    p.style.color = item.ui.textColor;
                    p.style.backdropFilter = 'blur(5px)';
                    
                    let btns = '';
                    if(item.ui.links.website) btns += '<a href="' + item.ui.links.website + '" target="_blank" class="action-btn" style="background:#34495e; color:#fff"><i class="fas fa-globe"></i></a>';
                    if(item.ui.links.telegram) btns += '<a href="https://t.me/' + item.ui.links.telegram + '" target="_blank" class="action-btn" style="background:#24A1DE; color:#fff"><i class="fab fa-telegram-plane"></i></a>';
                    if(item.ui.links.whatsapp) btns += '<a href="https://wa.me/' + item.ui.links.whatsapp + '" target="_blank" class="action-btn" style="background:#25D366; color:#fff"><i class="fab fa-whatsapp"></i></a>';
                    
                    p.innerHTML = '<div style="font-weight:bold; font-size:' + item.ui.textSize + 'rem; margin-bottom:10px">' + item.ui.text + '</div><div>' + btns + '</div>';
                    ui.appendChild(p);
                }
            });
        });

        // UPDATED UI SHIFT LOGIC WITH CACHING
        function showUI(i, vis) { 
            const p = document.getElementById('panel-'+i);
            const controls = document.getElementById('media-controls');
            
            // EXCLUSIVE UI FIX: HIDE ALL OTHER PANELS FIRST
            if (vis) {
                document.querySelectorAll('.info-panel').forEach(panel => {
                    if (panel.id !== 'panel-' + i) {
                        panel.classList.remove('visible');
                    }
                });
            }

            window.activeUIIndex = vis ? i : -1;

            if(vis) {
                if(p) p.classList.add('visible');
                if(p && controls) controls.classList.add('shifted');
                // TRIGGER CACHE UPDATE (Async)
                setTimeout(() => updateUICache(), 300); 
            } else {
                if(p) p.classList.remove('visible');
                
                // Only reset controls if NO panels are visible (double check)
                const anyVisible = document.querySelector('.info-panel.visible');
                if(!anyVisible && controls) controls.classList.remove('shifted');
                
                // Clear cache so it doesn't linger in video
                cachedUIOverlay = null;
            }
        }
        
        function hexToRgba(h, a) { const r = parseInt(h.slice(1,3),16), g = parseInt(h.slice(3,5),16), b = parseInt(h.slice(5,7),16); return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')'; }
    </script>
</body>
</html>
